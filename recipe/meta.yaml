{% set version = "4.0.0" %}

package:
  name: triqs_tprf
  version: {{ version }}

source:
  url: https://github.com/TRIQS/tprf/releases/download/{{ version }}/tprf-{{ version }}.tar.gz
  sha256: 5bb55c38b2f4bf8e581052c69022bed0b0805ef1419c544420dee7a76d353c6f

build:
  number: 0
  skip: true  # [win or py<30]
  ignore_run_exports:
    - libboost-devel

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - cmake
    - make
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - {{ mpi }}                              # [mpi == 'openmpi' and build_platform != target_platform]
    - setuptools  # [py>=312]
  host:
    - triqs {{ '.'.join(version.split('.')[:2]) }}
    - libboost-devel
    - fftw
    - {{ mpi }}
    - libblas
    - liblapack
    - numpy
    - python
    - setuptools  # [py>=312]
  run:
    - {{ pin_compatible("triqs", max_pin="x.x") }}
    - fftw
    - {{ mpi }}
    - libblas
    - liblapack
    - python
    - setuptools  # [py>=312]

test:
  commands:
    - export OMPI_MCA_btl=self,tcp
    - export OMPI_MCA_plm=isolated
    - export OMPI_MCA_rmaps_base_oversubscribe=yes
    - export OMPI_MCA_btl_vader_single_copy_mechanism=none
    - export mpiexec="mpiexec --allow-run-as-root"
    - python -c "import triqs_tprf"

about:
  home: https://triqs.github.io/tprf
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: The Two-Particle Response Function tool box for TRIQS

extra:
  recipe-maintainers:
    - wentzell
    - pgunn
    - thoemi09
